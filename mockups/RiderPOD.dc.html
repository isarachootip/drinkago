<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>ยืนยันส่งและรับถุงคืน</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#1A56B0}a:hover{color:#123F85}
button,input{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F3F7FA; font-family: 'IBM Plex Sans Thai', system-ui, sans-serif; color: #0F2236; display: flex; flex-direction: column; overflow: hidden">

  <div style="background: #FFFFFF; padding: 12px 16px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid #DCE4EC">
    <a href="RiderJobs.dc.html" aria-label="กลับไปงานวันนี้" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 22px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0F2236" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
    </a>
    <div style="display: flex; flex-direction: column">
      <span style="font-size: 17px; font-weight: 700">ยืนยันส่งสำเร็จ</span>
      <span style="font-size: 13px; color: #4A5B6E">#DG-1024 · คุณสมใจ · น้ำดื่มแบบถัง × 3</span>
    </div>
  </div>

  <div style="flex: 1; padding: 16px; display: flex; flex-direction: column; gap: 14px">

    <div style="background: #FFFFFF; border-radius: 14px; border: 1px solid #DCE4EC; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; justify-content: space-between; align-items: center">
        <span style="font-size: 15px; font-weight: 600">1. รูปถ่ายหลักฐานการส่ง</span>
        <span style="font-size: 12px; color: #C2255C; font-weight: 600">จำเป็น</span>
      </div>
      <button style="height: 128px; border: 2px dashed #9AABBD; border-radius: 12px; background: #F3F7FA; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; cursor: pointer">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#1A56B0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>
        <span style="font-size: 14px; font-weight: 600; color: #1A56B0">ถ่ายรูปสินค้าที่ส่งถึงมือลูกค้า</span>
      </button>
      <div style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #17613A; background: #E3F3E9; padding: 8px 12px; border-radius: 10px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#17613A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>
        <span style="flex: 1">พิกัดตรงกับที่อยู่ · ห่าง 12 ม.</span>
        <span>13:31</span>
      </div>
    </div>

    <div style="background: #FFFFFF; border-radius: 14px; border: 1px solid #DCE4EC; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
      <label for="otp-1" style="font-size: 15px; font-weight: 600">2. รหัสยืนยัน 4 หลักจากลูกค้า</label>
      <div style="display: flex; gap: 10px">
        <input id="otp-1" inputmode="numeric" maxlength="1" value="4" aria-label="รหัสหลักที่ 1" style="width: 56px; height: 56px; box-sizing: border-box; border: 1px solid #9AABBD; border-radius: 12px; text-align: center; font-size: 22px; font-weight: 700; color: #0F2236">
        <input inputmode="numeric" maxlength="1" value="8" aria-label="รหัสหลักที่ 2" style="width: 56px; height: 56px; box-sizing: border-box; border: 1px solid #9AABBD; border-radius: 12px; text-align: center; font-size: 22px; font-weight: 700; color: #0F2236">
        <input inputmode="numeric" maxlength="1" value="" aria-label="รหัสหลักที่ 3" style="width: 56px; height: 56px; box-sizing: border-box; border: 2px solid #1A56B0; border-radius: 12px; text-align: center; font-size: 22px; font-weight: 700; color: #0F2236">
        <input inputmode="numeric" maxlength="1" value="" aria-label="รหัสหลักที่ 4" style="width: 56px; height: 56px; box-sizing: border-box; border: 1px solid #9AABBD; border-radius: 12px; text-align: center; font-size: 22px; font-weight: 700; color: #0F2236">
      </div>
      <span style="font-size: 12px; color: #4A5B6E">ลูกค้าเห็นรหัสในข้อความ LINE ของออเดอร์นี้</span>
    </div>

    <div style="background: #FFFFFF; border-radius: 14px; border: 2px solid #C2255C; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; justify-content: space-between; align-items: center">
        <span style="font-size: 15px; font-weight: 600">3. รับถุงคืน</span>
        <span style="font-size: 12px; font-weight: 600; color: #9B1B49; background: #FCE8EF; padding: 3px 10px; border-radius: 10px">ลูกค้าแจ้งไว้ 3 ใบ</span>
      </div>
      <div style="display: flex; align-items: center; gap: 12px">
        <span style="flex: 1; font-size: 14px; color: #33475B">จำนวนที่รับจริง</span>
        <button aria-label="ลดจำนวนถุงที่รับ" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #DCE4EC; background: #FFFFFF; font-size: 20px; color: #0F2236; cursor: pointer">−</button>
        <span style="width: 32px; text-align: center; font-size: 20px; font-weight: 700">3</span>
        <button aria-label="เพิ่มจำนวนถุงที่รับ" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #DCE4EC; background: #FFFFFF; font-size: 20px; color: #0F2236; cursor: pointer">+</button>
      </div>
      <button style="min-height: 44px; border: 1px solid #F3C4D4; border-radius: 12px; background: #FCE8EF; color: #9B1B49; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9B1B49" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>
        ถ่ายรูปถุงที่รับคืน
      </button>
    </div>
  </div>

  <div style="background: #FFFFFF; border-top: 1px solid #DCE4EC; padding: 12px 16px 20px; display: flex; flex-direction: column; gap: 8px">
    <button style="width: 100%; min-height: 54px; border: none; border-radius: 14px; background: #1E7B45; color: #FFFFFF; font-size: 16px; font-weight: 600; cursor: pointer">ยืนยันส่งสำเร็จ และรับถุง 3 ใบ</button>
    <button style="width: 100%; min-height: 44px; border: none; background: transparent; color: #4A5B6E; font-size: 14px; text-decoration: underline; cursor: pointer">ส่งไม่สำเร็จ แจ้งเหตุผล</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
