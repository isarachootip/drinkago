<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>สั่งน้ำดื่ม</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#1A56B0}a:hover{color:#123F85}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F3F7FA; font-family: 'IBM Plex Sans Thai', system-ui, sans-serif; color: #0F2236; display: flex; flex-direction: column; overflow: hidden">

  <div style="background: #FFFFFF; padding: 20px 20px 16px; display: flex; flex-direction: column; gap: 12px; border-bottom: 1px solid #DCE4EC">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <div style="font-size: 20px; font-weight: 700; color: {{accent}}">Drink&amp;Go</div>
      <div style="font-size: 13px; color: #4A5B6E">สวัสดี คุณสมใจ</div>
    </div>
    <button style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 8px 12px; border: 1px solid #DCE4EC; border-radius: 12px; background: #F3F7FA; text-align: left; cursor: pointer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1A56B0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"></path><circle cx="12" cy="10" r="2.5"></circle></svg>
      <span style="flex: 1; display: flex; flex-direction: column">
        <span style="font-size: 12px; color: #4A5B6E">ส่งที่ · บ้าน</span>
        <span style="font-size: 14px; font-weight: 500; color: #0F2236">[ที่อยู่ลูกค้า]</span>
      </span>
      <span style="font-size: 13px; font-weight: 600; color: #1A56B0">เปลี่ยน</span>
    </button>
  </div>

  <div style="flex: 1; padding: 16px; display: flex; flex-direction: column; gap: 16px">

    <div style="display: flex; align-items: center; gap: 12px; padding: 12px 12px 12px 16px; background: #E6EEF9; border-radius: 14px">
      <div style="flex: 1; display: flex; flex-direction: column">
        <span style="font-size: 12px; color: #33475B">ออเดอร์ล่าสุด</span>
        <span style="font-size: 15px; font-weight: 600">น้ำดื่มแบบถัง × 3</span>
      </div>
      <button style="min-height: 44px; padding: 0 18px; border: none; border-radius: 22px; background: {{accent}}; color: #FFFFFF; font-size: 15px; font-weight: 600; cursor: pointer">สั่งซ้ำ</button>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="font-size: 15px; font-weight: 600">สินค้า</div>
      <div style="background: #FFFFFF; border-radius: 14px; border: 1px solid #DCE4EC">
        <div style="display: flex; align-items: center; gap: 12px; padding: 12px; border-bottom: 1px solid #DCE4EC">
          <div style="width: 48px; height: 48px; border-radius: 10px; background: #E6EEF9; display: flex; align-items: center; justify-content: center">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#1A56B0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 2h4v3h-4z"></path><path d="M8 5h8l1 3v12a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2V8z"></path><path d="M7 12h10"></path></svg>
          </div>
          <div style="flex: 1; display: flex; flex-direction: column">
            <span style="font-size: 15px; font-weight: 500">น้ำดื่มแบบถัง</span>
            <span style="font-size: 13px; color: #4A5B6E">฿[ราคา] / ถัง</span>
          </div>
          <div style="display: flex; align-items: center; gap: 4px">
            <button aria-label="ลดจำนวนน้ำดื่มแบบถัง" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #DCE4EC; background: #FFFFFF; font-size: 20px; color: #0F2236; cursor: pointer">−</button>
            <span style="width: 24px; text-align: center; font-size: 16px; font-weight: 600">3</span>
            <button aria-label="เพิ่มจำนวนน้ำดื่มแบบถัง" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: {{accent}}; font-size: 20px; color: #FFFFFF; cursor: pointer">+</button>
          </div>
        </div>
        <div style="display: flex; align-items: center; gap: 12px; padding: 12px">
          <div style="width: 48px; height: 48px; border-radius: 10px; background: #E6EEF9; display: flex; align-items: center; justify-content: center">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#1A56B0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="8" width="16" height="13" rx="2"></rect><path d="M8 8V5h2v3M14 8V5h2v3"></path></svg>
          </div>
          <div style="flex: 1; display: flex; flex-direction: column">
            <span style="font-size: 15px; font-weight: 500">น้ำดื่มแบบแพ็ก</span>
            <span style="font-size: 13px; color: #4A5B6E">฿[ราคา] / แพ็ก</span>
          </div>
          <div style="display: flex; align-items: center; gap: 4px">
            <button aria-label="ลดจำนวนน้ำดื่มแบบแพ็ก" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #DCE4EC; background: #FFFFFF; font-size: 20px; color: #0F2236; cursor: pointer">−</button>
            <span style="width: 24px; text-align: center; font-size: 16px; font-weight: 600">0</span>
            <button aria-label="เพิ่มจำนวนน้ำดื่มแบบแพ็ก" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: {{accent}}; font-size: 20px; color: #FFFFFF; cursor: pointer">+</button>
          </div>
        </div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px; padding: 14px 16px; background: #FFFFFF; border-radius: 14px; border: 1px solid #F3C4D4">
      <div style="display: flex; align-items: center; justify-content: space-between">
        <span style="font-size: 15px; font-weight: 600">มีถุงคืนรอบนี้ไหม?</span>
        <span style="font-size: 12px; font-weight: 600; color: #C2255C; background: #FCE8EF; padding: 3px 10px; border-radius: 10px">ถุงค้างของคุณ 3 ใบ</span>
      </div>
      <div style="display: flex; align-items: center; gap: 12px">
        <div role="group" aria-label="มีถุงคืนหรือไม่" style="display: flex; flex: 1; background: #F3F7FA; border-radius: 12px; padding: 3px">
          <button aria-pressed="false" style="flex: 1; min-height: 44px; border: none; border-radius: 10px; background: transparent; font-size: 14px; color: #4A5B6E; cursor: pointer">ไม่มี</button>
          <button aria-pressed="true" style="flex: 1; min-height: 44px; border: none; border-radius: 10px; background: #C2255C; font-size: 14px; font-weight: 600; color: #FFFFFF; cursor: pointer">มี</button>
        </div>
        <div style="display: flex; align-items: center; gap: 4px">
          <button aria-label="ลดจำนวนถุงคืน" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #DCE4EC; background: #FFFFFF; font-size: 20px; color: #0F2236; cursor: pointer">−</button>
          <span style="width: 40px; text-align: center; font-size: 15px; font-weight: 600">3 ใบ</span>
          <button aria-label="เพิ่มจำนวนถุงคืน" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #DCE4EC; background: #FFFFFF; font-size: 20px; color: #0F2236; cursor: pointer">+</button>
        </div>
      </div>
    </div>

    <div style="background: #FFFFFF; border-radius: 14px; border: 1px solid #DCE4EC">
      <button style="width: 100%; display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 16px; border: none; border-bottom: 1px solid #DCE4EC; background: transparent; text-align: left; cursor: pointer">
        <span style="flex: 1; font-size: 14px; color: #4A5B6E">รอบส่ง</span>
        <span style="font-size: 14px; font-weight: 600; color: #0F2236">วันนี้ 13:00–15:00</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#4A5B6E" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
      </button>
      <button style="width: 100%; display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 16px; border: none; background: transparent; text-align: left; cursor: pointer">
        <span style="flex: 1; font-size: 14px; color: #4A5B6E">ชำระเงิน</span>
        <span style="font-size: 14px; font-weight: 600; color: #0F2236">PromptPay QR</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#4A5B6E" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
      </button>
    </div>
  </div>

  <div style="background: #FFFFFF; border-top: 1px solid #DCE4EC; padding: 12px 16px 20px; display: flex; align-items: center; gap: 16px">
    <div style="display: flex; flex-direction: column">
      <span style="font-size: 12px; color: #4A5B6E">ยอดรวม (รวมค่าส่ง)</span>
      <span style="font-size: 20px; font-weight: 700">฿[ยอดรวม]</span>
    </div>
    <button style="flex: 1; min-height: 52px; border: none; border-radius: 14px; background: {{accent}}; color: #FFFFFF; font-size: 16px; font-weight: 600; cursor: pointer">ยืนยันสั่งซื้อ</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#1A56B0","options":["#1A56B0","#0B6E8A","#1E7B45"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#1A56B0' };
  }
}
</script>
</body>
</html>
