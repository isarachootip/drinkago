services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: drinkgo
      POSTGRES_PASSWORD: drinkgo
      POSTGRES_DB: drinkgo
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drinkgo"]
      interval: 3s
      retries: 20

volumes:
  pgdata:
